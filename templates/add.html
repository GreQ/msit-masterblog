<!DOCTYPE html>
<html   lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GreQx Blog</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header>
            <h1>Add Blog Post</h1>
        </header>
        <main>
            <form class="post-form" action="{{ url_for('add') }}" method="POST">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" value="{{ post.get('author', '') }}" required>

                <label for="title">Title:</label>
                <input type="text" id="title" name="title" value="{{ post.get('title', '') }}" required>

                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="8" required>{{ post.get('content', '') }}</textarea>

                <input type="submit" value="Add Post">
            </form>
            <p><a class="button" href="{{ url_for('index') }}">&larr; Back to all posts</a></p>
        </main>
    </body>
</html>
