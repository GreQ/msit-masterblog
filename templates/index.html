<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GreQx Blog</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header>
            <h1>Welcome to GreQx Blog</h1>
        </header>
        <main>
            {% for post in posts %}
                <article class="post">
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.content }}</p>
                    <p><em>By {{ post.author }}</em></p>
                </article>
            {% endfor %}
        </main>
    </body>
</html>
